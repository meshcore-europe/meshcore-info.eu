baseURL = "https://meshcore-info.eu/"
title = "meshcore-info.eu"
theme = "fieldmap"
disableKinds = ["taxonomy", "term", "RSS"]
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true
enableRobotsTXT = true
# A post may carry its launch date before that day (the launch post); Astro shows it too.
buildFuture = true

[params]
  repo = "https://github.com/meshcore-europe/meshcore-info.eu"
  repoBranch = "main"
  # Translations live in their own repository.
  i18nRepo = "https://github.com/meshcore-europe/meshcore-info.eu_i18n"
  i18nRepoBranch = "main"

# Plain <pre><code>: the CSP forbids the inline styles Chroma emits.
# noClasses = false makes {{< highlight >}} emit classes, not style="".
[markup.highlight]
  codeFences = false
  noClasses = false

# Built-in embed shortcodes would load third-party content.
[privacy.instagram]
  disable = true
[privacy.vimeo]
  disable = true
[privacy.x]
  disable = true
[privacy.youtube]
  disable = true

[languages.en]
  label = "English"
  weight = 1
  contentDir = "content/en"

