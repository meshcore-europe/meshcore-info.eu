# The CLI commands of stock MeshCore firmware 1.18.0 (tag repeater-v1.18.0 of meshcore-dev/MeshCore),
# shown on /guides/cli/. Read from the firmware source, not from docs/cli_commands.md, which lags
# behind it. source is the handler, default_source the line that sets the value a new repeater starts with
# (paths in that tag). nodes are the example firmwares that accept the command. Commands only in a fork stay out.
# Re-read the source of a new release before changing an entry.
# MeshCore stock firmware CLI commands, read from source at tag repeater-v1.18.0 (81dbae5), the same commit as
# companion-v1.18.0. Defaults are the repeater's (examples/simple_repeater); room server, sensor and companion can
# differ. A command only a companion takes has the companion's default (examples/companion_radio/NodePrefs.h).

