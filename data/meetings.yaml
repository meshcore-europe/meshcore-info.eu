# The meetings on /meetings/. Public meetings anyone can join, each checked live on the last_checked date.
# A meeting has a group that runs it, a group that lists it (listed_by) or a name of its own (who, with a public
# link). A date and time are local, in the meeting's time zone. Without repeat it is one date; weekly repeats on that
# weekday, monthly on that weekday's place in the month. A repeating meeting stays listed for 6 months after
# last_checked. join holds each way to take part, once per kind: in person (place, and location when it differs from the group), online (url) or on a channel (place). A meeting with a way in person shows on the map at that location, or else that of its group. name and place stay in the language of the meeting and are not translated.

