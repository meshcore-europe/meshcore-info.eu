# Live maps and analyzers, checked live on last_checked.
# scope europe also covers worldwide maps that include Europe.
# Descriptions live in data/i18n/en.json as map.<id>.desc.
# runs_on names the map an entry is a tenant of: the same app and database under a
# community's own name and design. The page shows that map and its tenants first.

- id: meshcore-official-map
  name: MeshCore Node Map
  url: "https://map.meshcore.io/"
  scope: europe
  shows: [nodes]
  desc_key: map.meshcore-official-map.desc
  last_checked: 2026-10-02

